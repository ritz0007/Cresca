  http: ^1.4.0
  youtube_explode_dart: ^2.5.2
  just_audio: ^0.10.5
  audio_service: ^0.18.17
  crypto: ^3.0.6
  path_provider: ^2.1.5
  url_launcher: ^6.3.2
  share_plus: ^11.1.0
  webview_flutter: ^4.13.0
  google_fonts: ^6.2.1
  background_downloader: ^9.1.0
  app_links: ^6.3.2

dev_dependencies:
